<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz 30 de septiembre ❤️</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#00152d}
body{display:flex;justify-content:center;overflow-x:hidden;font-family:Arial,sans-serif}
.page{
  position:relative;
  width:min(100vw,710px);
  min-height:100vh;
  background:#00152d;
  overflow:hidden;
}
.cover{
  width:100%;
  display:block;
  cursor:pointer;
  user-select:none;
}
.music{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:20;
  border:0;
  border-radius:999px;
  padding:12px 16px;
  background:rgba(255,255,255,.9);
  color:#132a66;
  font-weight:bold;
  box-shadow:0 4px 18px #0008;
  cursor:pointer;
}
.hint{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  z-index:19;
  color:white;
  background:#0008;
  padding:8px 12px;
  border-radius:20px;
  font-size:13px;
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:30;
  background:rgba(0,0,0,.88);
  align-items:center;
  justify-content:center;
  padding:18px;
}
.modal.show{display:flex}
.modal img{
  max-width:min(92vw,520px);
  max-height:90vh;
  border-radius:14px;
  box-shadow:0 0 35px #000;
}
.close{
  position:fixed;
  top:18px;
  right:20px;
  color:#fff;
  font-size:34px;
  cursor:pointer;
}
</style>
</head>
<body>
<main class="page">
  <img class="cover" src="portada.jpg" alt="Feliz 30 de septiembre" id="cover">
</main>

<button class="music" id="musicBtn">🔊 Música</button>
<div class="hint">Toca la imagen para abrir el mensaje ❤️</div>

<div class="modal" id="modal">
  <span class="close" id="close">×</span>
  <img src="mensaje.jpg" alt="Mensaje especial">
</div>

<audio id="audio" loop preload="auto">
  <source src="musica.mp3" type="audio/mpeg">
</audio>

<script>
const modal=document.getElementById('modal');
const cover=document.getElementById('cover');
const close=document.getElementById('close');
const audio=document.getElementById('audio');
const musicBtn=document.getElementById('musicBtn');

cover.addEventListener('click',()=>modal.classList.add('show'));
close.addEventListener('click',()=>modal.classList.remove('show'));
modal.addEventListener('click',e=>{if(e.target===modal) modal.classList.remove('show')});

musicBtn.addEventListener('click', async ()=>{
  try{
    if(audio.paused){
      await audio.play();
      musicBtn.textContent='⏸️ Pausar';
    }else{
      audio.pause();
      musicBtn.textContent='🔊 Música';
    }
  }catch(e){
    alert('Agrega un archivo llamado "musica.mp3" en esta misma carpeta y vuelve a tocar Música.');
  }
});
</script>
</body>
</html>
